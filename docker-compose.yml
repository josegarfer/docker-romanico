services:
  db:
    image: mysql:8.0
    container_name: romanico-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red-backyard

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: romanico-backend
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backend:/var/www/html
    environment:
      - CODESPACE_NAME=${CODESPACE_NAME:-}
      - GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN=${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
      - DB_CONNECTION=mysql
      - DB_HOST=romanico-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - red-backyard
      - red-frontal

  backend-nginx:
    image: nginx:alpine
    container_name: romanico-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    # PUERTO MAPEADO: Para que funcione en Codespaces y local sin configurar nada.
    # NOTA SEGURIDAD: En producción real (Zero Trust), comentar la línea de ports y usar Nginx Proxy Manager.
    ports:
      - "8083:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - red-frontal
      - proxy-public

volumes:
  db_data:

networks:
  red-backyard:
    internal: true
  red-frontal:
  proxy-public:
    external: true