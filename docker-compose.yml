services:

  db:
    image: mysql:8.0
    container_name: romanico-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: romanico
      MYSQL_USER: romanico
      MYSQL_PASSWORD: romanico123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - romanico-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: romanico-backend
    depends_on:
      - db
    volumes:
      - ./backend:/var/www/html
    environment:
      - CODESPACE_NAME=${CODESPACE_NAME:-}
      - GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN=${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
    networks:
      - romanico-net

  backend-nginx:
    image: nginx:alpine
    container_name: romanico-backend-nginx
    depends_on:
      - backend
    ports:
      - "8083:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - romanico-net

volumes:
  db_data:

networks:
  romanico-net:
    driver: bridge