version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: romanico-db
    restart: unless-stopped
    environment:
      # Usamos :- para dar valores por defecto y que no falle en Codespaces si el .env no existe
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-romanico}
      MYSQL_USER: ${DB_USERNAME:-romanico}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red-backyard

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: romanico-backend
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backend:/var/www/html
    environment:
      - CODESPACE_NAME=${CODESPACE_NAME:-}
      - GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN=${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
      - DB_CONNECTION=mysql
      - DB_HOST=romanico-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-romanico}
      - DB_USERNAME=${DB_USERNAME:-romanico}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - red-backyard
      - red-frontal

  backend-nginx:
    image: nginx:alpine
    container_name: romanico-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8083:80"
    volumes:
      # REFORZADO: Nginx solo necesita entrar en la carpeta public de Laravel
      - ./backend/public:/var/www/html/public:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - red-frontal
      - proxy-public

volumes:
  db_data:

networks:
  red-backyard:
    internal: true # Aislamiento total: la DB no tiene salida a internet
  red-frontal:
  proxy-public:
    # PARA CODESPACES Y DEBIAN:
    # Si la red existe (Debian), se une. Si no existe (Codespaces), la crea.
    name: proxy-public
    external: false